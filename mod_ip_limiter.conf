###################################################################################################
# MOD-IPLimiter
#
#    IPLimit.Enabled
#        Description: Enable/Disable the IP limit module.
#        Default:     0 - (Disabled)
#                     1 - (Enabled)
IPLimit.Enabled = 0

#    IPLimit.MaxPlayersPerIP
#        Description: Maximum number of players allowed from a single IP address.
#                     If exceeded, players from that IP will be kicked according
#                     to IPLimit.KickMode.
#        Default:     5
IPLimit.MaxPlayersPerIP = 5

#    IPLimit.CheckInterval
#        Description: How often (in milliseconds) the system checks for IP limit violations.
#        Default:     30000 (30 seconds)
IPLimit.CheckInterval = 30000

#    IPLimit.Whitelist
#        Description: A comma-separated list of IP addresses that are exempt from the limit.
#        Example:     "192.168.1.100,192.168.1.101,203.0.113.50"
#        Default:     "" (empty)
IPLimit.Whitelist = ""

#    IPLimit.KickMode
#        Description: What to do when the per-IP limit is exceeded.
#        Default:     0 - (Kick all players from that IP)
#                     1 - (Kick only the newest players, bringing the count down to the limit)
#
#        Mode 0 kicks every session from the offending IP.
#        Mode 1 kicks only the (count - limit) newest connections and leaves
#        the older ones online. "Newest" is determined by login time, not
#        character creation date.
IPLimit.KickMode = 0

#    IPLimit.KickDelay
#        Description: Delay in seconds before the kick is actually performed.
#        Default:     0     - (Kick immediately, no warning message)
#                     1-300 - wait this many seconds (hard cap: 300 = 5 minutes)
#
#        With a non-zero delay, affected players receive a warning message
#        (controlled by IPLimit.ShowWarning / IPLimit.WarningMessage) and the
#        actual kick is executed by a background timer.
#
#        Cancellation rules:
#          - If a scheduled player logs off before the timer fires, no kick.
#          - If a scheduled player relogs before the timer fires, the pending
#            kick is cancelled (a fresh login starts with a clean slate).
#          - If IPLimit.Enabled is set to 0, all pending kicks are cancelled.
IPLimit.KickDelay = 0

#    IPLimit.ShowWarning
#        Description: Send a middle-screen notification to each player who is
#                     scheduled for a delayed kick.
#        Only has an effect when IPLimit.KickDelay > 0.
#        Default:     1 - (Enabled)
#                     0 - (Disabled)
IPLimit.ShowWarning = 1

#    IPLimit.WarningMessage
#        Description: Message sent to each player who is scheduled for a
#                     delayed kick (only used when IPLimit.KickDelay > 0
#                     and IPLimit.ShowWarning = 1).
#
#                     The placeholder {seconds} is replaced with the
#                     configured KickDelay value. All occurrences are
#                     replaced. If the token is absent, the message is
#                     sent unchanged. An empty value disables the message
#                     entirely (equivalent to IPLimit.ShowWarning = 0).
#
#                     Sent as a middle-screen notification (SMSG_NOTIFICATION).
#                     Keep it short — long strings get truncated by the client.
#
#        Default:     "Your IP has been detected to be over the configured limit. You will be kicked in {seconds} seconds."
IPLimit.WarningMessage = "Your IP has been detected to be over the configured limit. You will be kicked in {seconds} seconds."

# Logger.modules.iplimit
#    Description: Logging for the IP limit module.
Logger.modules.iplimit=3,Console Server
